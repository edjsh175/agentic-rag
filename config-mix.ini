; ============================================================
; RAG 临时混用配置（config-mix.ini）—— 非生产默认
; ============================================================
; 用途：问答/embedding/视觉走远程 Ollama；图谱 LLM 抽取走本机 gemma4
;       （可选）任一角色可切到外部 OpenAI 兼容 API
;
; 启用方式（必须新开进程，Config 单例启动时读一次）：
;   $env:RAG_CONFIG = "config-mix.ini"
;   .\venv\Scripts\python.exe run_graph_build.py extract --doc-category StampServer --include-llm
;
; 切回默认：
;   Remove-Item Env:RAG_CONFIG
;   （或 $env:RAG_CONFIG = "config.ini"）
;
; 优先级：环境变量 > 本文件 > 代码默认值
; 环境变量名 = {SECTION}_{KEY} 全大写，section 中的点改为下划线
;   例：OLLAMA_BASE_URL
;       MODEL_LLM_PROVIDER / MODEL_LLM_BASE_URL / MODEL_LLM_API_KEY_ENV
;       GRAPH_EXTRACTION_LLM_BASE_URL / GRAPH_EXTRACTION_LLM_MODEL
; ============================================================

[ollama]
; 主地址：embedding / 问答 llm / helper / vision / 图检索改写 等
base_url = http://192.168.10.158:11434
;base_url = http://127.0.0.1:11434

[model]
; 向量嵌入模型（用于文档向量化，切换后需重建知识库）
; 默认 qwen3-embedding:4b
embedding = qwen3-embedding
;embedding = qwen3-embedding:4b

; 问答 LLM 模型（RAG 检索后生成回答）
; DeepSeek 官方低成本思考模型；深度模式开启时会请求 reasoning_content
llm = deepseek-v4-flash

[model.llm]
provider = openai
model = deepseek-v4-flash
base_url = https://api.deepseek.com/v1
api_key_env = DEEPSEEK_API_KEY

; 辅助 LLM 模型（用于查询理解、改写、澄清、历史摘要与证据审查）
helper_llm = deepseek-v4-flash

[model.helper_llm]
provider = openai
model = deepseek-v4-flash
base_url = https://api.deepseek.com/v1
api_key_env = DEEPSEEK_API_KEY

[model.compression]
provider = openai
model = deepseek-v4-flash
base_url = https://api.deepseek.com/v1
api_key_env = DEEPSEEK_API_KEY

; 视觉模型（用于图片描述和视频帧分析）
; 默认 qwen3-vl:8b。可选 qwen3-vl:4b（更轻量）
;vision = qwen3-vl:8b
;vision = qwen3-vl:4b
vision = qwen3-vl:8b

[answer]
; 知识库无明确依据时，是否允许在固定提示后提供明确标注的通用知识补充
; 环境变量 ANSWER_ALLOW_GENERAL_KNOWLEDGE 可覆盖此值
allow_general_knowledge = true


[vector_store]
; ChromaDB 向量数据持久化目录
persist_directory = ./chroma_db
; ChromaDB 集合名称
collection_name = rag_knowledge

[text]
; 文档分块大小（token 数），越大每块信息越完整，但检索精度下降
chunk_size = 500
; 相邻分块的重叠 token 数，保持跨块上下文连贯
chunk_overlap = 50
; 是否提取 Word/PDF 内嵌图片并用视觉模型描述（false 则仅提取文字，避免大图超时）
extract_embedded_images = false
; 是否使用 unstructured 按标题切片（true=优先章节切片，false=仅固定长度）
use_unstructured = true
; unstructured 解析策略：fast（快速）/ hi_res（高精度，需要额外依赖）
unstructured_strategy = fast

[chunk_profiles]
; 策略只能按 Profile 配置，不支持单文档阈值覆盖。
section_based_target_min = 0
section_based_target_max = 800
section_based_soft_max = 1200
section_based_command_follow_max = 1500
section_based_table_row_group_max = 500
technical_manual_target_min = 300
technical_manual_target_max = 800
technical_manual_soft_max = 1200
technical_manual_command_follow_max = 1500
technical_manual_table_row_group_max = 500
procedure_target_min = 0
procedure_target_max = 800
procedure_soft_max = 1200
procedure_command_follow_max = 1500
procedure_table_row_group_max = 500
api_doc_target_min = 0
api_doc_target_max = 800
api_doc_soft_max = 1200
api_doc_command_follow_max = 1500
api_doc_table_row_group_max = 500
table_doc_target_min = 0
table_doc_target_max = 800
table_doc_soft_max = 1200
table_doc_command_follow_max = 1500
table_doc_table_row_group_max = 500
record_list_target_min = 0
record_list_target_max = 800
record_list_soft_max = 1200
record_list_command_follow_max = 1500
record_list_table_row_group_max = 500

[retrieval]
; 向量检索返回 top_k 个文档块给 LLM，越大候选越多但可能引入噪声
top_k = 8
; MMR 检索初选数量，top_k 的候选池，越大多样性越好
fetch_k = 20
; MMR 多样性权重（0=纯多样，1=纯相关），0.7 表示偏相关性
lambda_mult = 0.7

[retrieval_strategy]
; 检索方式：mmr | similarity | bm25 | hybrid
method = hybrid
; Hybrid 融合方式（阶段三固定使用 RRF）
fusion_method = rrf
; RRF 排名平滑常数
rrf_k = 60
; Hybrid 每条检索分支召回的候选数量
candidate_k = 20

[query_planner]
; 意图驱动检索计划：流程型/部署/排错/对比问题动态扩展查询并提高召回量
enabled = true
llm_timeout = 15
procedure_top_k = 8
procedure_candidate_k = 24
troubleshooting_top_k = 6
troubleshooting_candidate_k = 18
comparison_top_k = 6
comparison_candidate_k = 18
max_expanded_queries = 8
neighbor_window = 2
max_neighbors_per_source = 6

[cache]
embedding_cache_enabled = true
embedding_cache_capacity = 10000
query_cache_enabled = false
query_cache_ttl_seconds = 300
query_cache_capacity = 256
retrieval_executor_workers = 4

[reranker]
; 是否启用 Cross-Encoder 重排序（Phase 4），启用后粗召回 candidate_k 条再精排为 top_n 条
enabled = true
; 重排序器类型: bge (FlagEmbedding) | cross_encoder (sentence-transformers)
type = bge
; 重排序模型名称（BAAI/bge-reranker-v2-m3 原生支持中文，Apache 2.0）
; 可填写 HuggingFace 模型名，或完整本地目录（例如 ./models/bge-reranker-v2-m3）
; 本地目录必须包含 config.json 和模型权重，残缺下载会自动降级而不会中断检索
model = ./models/bge-reranker-v2-m3
; 重排序后返回给 LLM 的最终文档数
top_n = 8
; 粗检索阶段召回的候选文档数（供重排序器打分筛选）
candidate_k = 20

[scanner]
; 监视目录：支持绝对/相对路径，自动递归遍历所有子目录
; 新放入的文件会被自动检测、向量化、入库
watch_directory = ./watch_directory

; 定时扫描间隔（分钟），检测新文件和变更文件
interval_minutes = 30

; 自动处理的文件类型，逗号分隔
; 图片/视频类型需要配置视觉模型
;file_types = pdf,docx,doc,txt,jpg,jpeg,png,gif,bmp,webp,mp4,avi,mov,mkv
file_types = pdf,docx,doc,txt,md,xls,xlsx,pptx,html,htm,sql,cnf,conf,cfg,ini,xml,jpg,jpeg,png,gif,bmp,webp,mp4,avi,mov,mkv,flv,wmv

[path]
; 数据目录（存放 file_index.json 等运行时数据）
data_dir = ./data
; 日志目录（自动轮转，保留 7 天）
log_dir = ./logs

[server]
; FastAPI 监听地址，0.0.0.0 表示所有网卡
host = 0.0.0.0
; FastAPI 监听端口
port = 10605

[blog]
; 博客文章发布后的存放目录（watch_directory 子目录），用于自动扫描入库
posts_dir = ./watch_directory/已发布文章
; 爬取后未发布的文章临时目录（和 watch_directory 同级）
crawl_dir = ./scrape_article

[crawl]
; 爬取文章时，图片下载到此目录（nginx 代理为 /scraping）
image_dir = ./scrapingImages

[relational_db]
; SQLite 关系数据库文件路径（存储实体、关系、实体-知识块关联）
db_path = ./data/rag_relational.db

[blog_publish]
; 博客发布系统文章列表 API（返回 [{id, title, contentMd}]）
; 设为空则跳过定时同步，仅使用本地文件
;api_url = http://192.168.10.206:8080/zslt/web/article/listAll
api_url =
; 与博客系统同步间隔（分钟）
sync_interval = 30
; 发布文章到博客系统的 addRag 接口，设为空则仅本地发布不入库外部系统
;add_rag_url = http://192.168.10.206:8080/zslt/web/article/addRag
add_rag_url =

[retrieval_quality]
; 检索后处理质量控制总开关（Phase 5）
enabled = false

; 相似度阈值过滤：quality_score < threshold 的 chunk 丢弃
; 第一版先关闭，A/B 评估后再决定阈值
score_threshold_enabled = false
score_threshold = 0.35

; Chunk 去重：Jaccard 相似度 > threshold 的只保留得分最高的
jaccard_dedup_enabled = true
jaccard_threshold = 0.85

; 动态 TopK：相邻得分断崖超过该比例时截断
dynamic_topk_enabled = true
score_drop_ratio = 0.5
; 截断后最少保留数量
min_top_k = 3
; 截断前最多保留数量
max_top_k = 8

; 上下文压缩：使用轻量 LLM 从 chunk 中提取相关片段
; 会增加延迟，第一版先关闭
contextual_compression_enabled = false
compression_model = deepseek-v4-flash
max_compressed_chunk_chars = 800

; 调试日志
debug_log_enabled = true

[context_budget]
; Context 自动裁剪 —— Token 预算控制
; 在发送给 LLM 前，按 token 预算自动裁剪 context 和 history，防止超上下文窗口

; 总开关（false 则不裁剪，行为与之前相同）
enabled = true

; 模型上下文窗口大小（tokens）
; qwen3:30b = 32768，deepseek-r1:7b = 65536，切换模型时同步修改
context_window = 32768

; 生成预留 tokens（必须与 num_predict 对齐）
generation_reserve = 2048

; 系统提示词预留 tokens（固定开销估算）
system_reserve = 1000

; 当前问题预留 tokens
question_reserve = 500

; context chunk 在可用预算中的占比（剩余给 history）
; 0.7 表示 70% 给 context，30% 给历史对话
context_ratio = 0.7

; 字符数 / token 估算系数
; 中文约 1.5，偏保守取 1.3（宁可多裁一点，确保安全）
chars_per_token = 1.3

[history_compression]
; 历史消息压缩与摘要控制
; 当对话历史轮数超过 max_raw_rounds 时，触发将较早对话压缩为摘要

; 总开关
enabled = true

; 压缩后保留的最小原始对话轮数（1 轮包含 1 条 user 和 1 条 assistant 消息，最近的 N 轮不进行压缩，保持完整记忆）
min_raw_rounds = 5

; 触发压缩的最大原始对话轮数（超过此值才开始压缩）
max_raw_rounds = 10


[structured_retrieval]
; 表格与结构化检索加权配置
enabled = true
table_boost = 0.03
table_header_boost = 0.01
section_match_boost = 0.02

[graph_retrieval]
; 图谱侧 chunk 召回/融合（本地体验开；生产模板仍默认关）
enabled = true
; 主干实体锚定改写（口语→canonical query + 回答侧关系摘要）：与 chunk 召回解耦，可单独开启
query_rewrite_enabled = true
; 锚点硬约束 chunk 过滤（canonical/产品线对齐；本地体验开，生产模板仍关）
anchor_chunk_filter_enabled = true
anchor_graph_chunk_enabled = true
min_link_confidence = 0.75
min_entity_confidence = 0.7
min_relation_confidence = 0.7
max_entities = 16
max_chunks = 24
graph_weight = 1.25
; 融合控噪：纯图路（文本未命中）最多占几席；配合 protect_text_top1 防 005/020 类回退
max_graph_only_slots = 2
protect_text_top1 = true

[graph_extraction.llm]
; Strategy B: LLM is the default primary path for navigational leaves.
; 【遗留摸底，非验收】外部模型仅一次性对照；结项/扩面验收必须 RAG_CONFIG=config-local.ini
; 禁止把本文件下的抽取结果写入「本地化通过」结论
enabled = true
; 提供商: ollama | openai
provider = openai
model = deepseek-chat
base_url = https://api.deepseek.com/v1
api_key_env = OPENAI_API_KEY
temperature = 0.0
max_retries = 2
; 最小置信度阈值，低于此值的候选被丢弃为 diagnostic
min_confidence = 0.60
; 含 LLM 的 batch 禁止自动审批；勿配置 auto_approve（已移除死配置）
prompt_version = v3
extractor_version = v1
; 语义提取调用模型 API 之间的延时控频（秒），0.0 表示不延时
rate_limit_delay = 1.5

[clarification]
; 提问前歧义预检（反问卡片）：意图模糊 / 实体不确定时先问用户
enabled = true
min_options = 2
; 由 helper LLM 主判是否反问；选项种子来自产品主干，命中后全列
llm_enabled = true
llm_timeout_seconds = 15

[qa_trace]
; 全流程问答 trace（问答证据调试页历史回放）；关闭后不写盘
; retain_days/max_traces = 0 表示永久保留，不做自动清理
enabled = true
max_content_preview = 240
max_candidates = 20
retain_days = 30
max_traces = 5000

