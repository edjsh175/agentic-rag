; ============================================================
; RAG 知识库问答系统 —— 206 生产配置（对齐本机 config.ini 能力开关）
; 备份：config.ini.bak_before_align_local
; 变更要点：
;   - graph_retrieval / 锚点 / 融合控噪 与本机一致（开）
;   - 主问答 llm = deepseek-r1:14b（Ollama 192.168.10.158）
;   - Reranker 保持关闭（镜像未装 + 容器 RERANKER_ENABLED=false）
;   - graph_extraction.llm 完全体 B：enabled=true + provider=ollama（无 Google 密钥）
; ============================================================
; 优先级：环境变量 > config.ini > 代码默认值
; ============================================================

[ollama]
base_url = http://192.168.10.158:11434

[model]
embedding = qwen3-embedding
llm = deepseek-r1:14b
helper_llm = gemma3:4b
vision = qwen3-vl:8b

[answer]
allow_general_knowledge = false

[vector_store]
persist_directory = /app/chroma_db
collection_name = rag_knowledge

[text]
chunk_size = 500
chunk_overlap = 50
extract_embedded_images = false
use_unstructured = true
unstructured_strategy = fast

[retrieval]
top_k = 8
fetch_k = 20
lambda_mult = 0.7

[retrieval_strategy]
method = hybrid
fusion_method = rrf
rrf_k = 60
candidate_k = 20

[query_planner]
enabled = true
llm_timeout = 15
procedure_top_k = 8
procedure_candidate_k = 24
troubleshooting_top_k = 6
troubleshooting_candidate_k = 18
comparison_top_k = 6
comparison_candidate_k = 18
max_expanded_queries = 8
neighbor_window = 2
max_neighbors_per_source = 6

[cache]
embedding_cache_enabled = true
embedding_cache_capacity = 10000
query_cache_enabled = false
query_cache_ttl_seconds = 300
query_cache_capacity = 256
retrieval_executor_workers = 4

[reranker]
; 206 完全体 B：HttpReranker → 158 GPU 机 :8001（镜像可不装本地 torch）
; CPU torch 时长文档可能 >30s，建议 timeout>=120
enabled = true
type = http
base_url = http://192.168.10.158:8001
timeout = 120
model =
top_n = 8
candidate_k = 20

[scanner]
watch_directory = /app/watch_directory
interval_minutes = 30
file_types = pdf,docx,doc,txt,md,xls,xlsx,pptx,html,htm,sql,cnf,conf,cfg,ini,xml,jpg,jpeg,png,gif,bmp,webp,mp4,avi,mov,mkv,flv,wmv

[path]
data_dir = /app/data
log_dir = /app/logs

[server]
host = 0.0.0.0
port = 10605

[blog]
posts_dir = /app/watch_directory/已发布文章
crawl_dir = /app/scrape_article

[crawl]
image_dir = /app/scrapingImages

[relational_db]
db_path = /app/data/rag_relational.db

[blog_publish]
api_url = http://192.168.10.206:8080/zslt/web/article/listAll
sync_interval = 30
add_rag_url = http://192.168.10.206:8080/zslt/web/article/addRag

[retrieval_quality]
enabled = false
score_threshold_enabled = false
score_threshold = 0.35
jaccard_dedup_enabled = true
jaccard_threshold = 0.85
dynamic_topk_enabled = true
score_drop_ratio = 0.5
min_top_k = 3
max_top_k = 8
contextual_compression_enabled = false
compression_model = qwen2.5:7b
max_compressed_chunk_chars = 800
debug_log_enabled = true

[context_budget]
enabled = true
context_window = 32768
generation_reserve = 2048
system_reserve = 1000
question_reserve = 500
context_ratio = 0.7
chars_per_token = 1.3

[history_compression]
enabled = true
min_raw_rounds = 5
max_raw_rounds = 10

[structured_retrieval]
enabled = true
table_boost = 0.03
table_header_boost = 0.01
section_match_boost = 0.02

[graph_retrieval]
; 与本机 config.ini 对齐（开图体验）
enabled = true
query_rewrite_enabled = true
anchor_chunk_filter_enabled = true
anchor_graph_chunk_enabled = true
graph_chunk_entity_allowlist = PipelineBuilder
min_link_confidence = 0.75
min_entity_confidence = 0.7
min_relation_confidence = 0.7
max_entities = 16
max_chunks = 24
graph_weight = 1.25
max_graph_only_slots = 2
protect_text_top1 = true

[graph_extraction.llm]
; 完全体 B：开 LLM 抽取；206 用 158 Ollama（qwen3-vl:8b），非 Google
enabled = true
provider = ollama
model = qwen3-vl:8b
temperature = 0.0
max_retries = 2
min_confidence = 0.60
prompt_version = v3
extractor_version = v1

[clarification]
enabled = true
min_options = 2
max_options = 4
llm_enabled = true
llm_timeout_seconds = 15

[qa_trace]
enabled = true
max_content_preview = 240
max_candidates = 20
retain_days = 14
max_traces = 2000

[agent_orchestration]
; 对话 Agent 检索编排（PRD V1.3）。false = 完整回退现有 DAG；true = 启用全流程 Agent 工具编排
enabled = true
max_steps = 8
max_retrieve_attempts = 2
tool_timeout = 60
heartbeat_initial_delay = 1.5
heartbeat_interval = 5
